name: Sync Cosense

# 公開 Cosense (kinjo1130) の [public.icon] 付きページを content/cosense に取り込む。
# 差分があるときだけ main にコミットし、その push で Vercel が再デプロイする。
on:
  schedule:
    # JST 6:00 / 18:00
    - cron: "0 21,9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-cosense
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/cosense/sync.mjs

      - name: Commit if changed
        run: |
          git add content/cosense
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: Cosense の記事を同期"
          git push
